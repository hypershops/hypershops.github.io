<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hypershops - Resell</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; padding: 20px; display: flex; justify-content: center; }
        .product-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; width: 100%; }
        .product-card { background: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .product-card img { max-width: 100%; height: auto; border-radius: 8px; max-height: 200px; object-fit: cover; }
        .product-card h3 { margin: 15px 0 10px 0; font-size: 1.4rem; color: #333; }
        .price { font-size: 1.2rem; color: #e44d26; font-weight: bold; margin-bottom: 20px; }
        .buy-btn { background-color: #0070ba; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; text-decoration: none; display: inline-block; transition: background 0.2s; }
        .buy-btn:hover { background-color: #005ea6; }
    </style>
</head>
<body>

<div class="product-grid">
  <div class="product-card">
    <img src="https://unsplash.com" alt="Buty sportowe">
    <h3>Limitowane Sneakersy</h3>
    <p class="price">499.00 PLN</p>
    <a href="#" class="buy-btn">Kup teraz</a>
  </div>
</div>

</body>
</html>
